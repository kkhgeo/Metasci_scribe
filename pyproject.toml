[project]
name = "metasci-scribe"
version = "0.1.0.dev0"
description = "Metasci Scribe: a terminal writing agent for scientific manuscripts (fork of EvoScientist v0.3.8)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Metasci Scribe contributors" },
]
keywords = ["scientific-writing", "manuscript", "terminal-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "deepagents[quickjs]~=0.7.32",
    "langchain-quickjs>=0.3.9",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "langchain-deepseek>=1.1.1",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    # 0.11.0+ SSE regressions: teardown noise + mid-turn ReadTimeout
    "openrouter>=0.10.8,<0.11.0",
    "tavily-python>=0.7",
    "pyyaml>=6.0",
    "rich>=15.0",
    "prompt-toolkit>=3.0",
    "questionary>=2.1",
    "typer>=0.24",
    "python-dotenv>=1.0",
    "langgraph-api>=0.7.30",
    "langgraph-cli[inmem]>=0.4",
    "langgraph-sdk>=0.4",
    "langgraph-checkpoint-sqlite>=3.0",
    "httpx>=0.28",
    "psutil>=6.0",
    "filelock>=3.16",
    # WebUI setup stage: the supported WebUI version range
    "packaging>=24.0",
    "lazy-loader>=0.5",
    "markdownify>=1.2",
    "tzlocal>=5.0",
    "langchain-mcp-adapters>=0.3.2",
    # <8.2.7: 8.2.7 Kitty "report-all-keys" breaks CJK input on iTerm2
    "textual>=8.0,<8.2.7",
    # 49+ ships no Intel macOS wheel
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Complement of the cap above so `uv lock` forks and other platforms keep the newest release
    "cryptography; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "build>=1.0",
    "pre-commit>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.6",
    "ruff>=0.5",
    "build>=1.0",
    "pre-commit>=3.5.0",
]

[project.urls]
"Upstream (EvoScientist v0.3.8)" = "https://github.com/EvoScientist/EvoScientist"

[project.scripts]
metasci-scribe = "metasci_scribe.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["metasci_scribe*"]

[tool.setuptools.package-data]
metasci_scribe = [
    "subagents/*.yaml",
    "langgraph_dev/*.json",
    "skills/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Seconds per test; a hang fails that test instead of stalling the run.
timeout = 60
filterwarnings = [
    "ignore::UserWarning:langchain_nvidia_ai_endpoints",
    # The CLI uses the v3 streaming protocol on purpose and filters this too.
    "ignore:.*v3 streaming protocol on Pregel is experimental.*",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (Error & Warning)
    "F",       # Pyflakes (Logical errors)
    "I",       # isort (Import sorting)
    "B",       # flake8-bugbear (Common bugs)
    "C4",      # flake8-comprehensions (List/Dict perf)
    "UP",      # pyupgrade (Modern Python syntax)
    "PT",      # flake8-pytest-style (If using Pytest)
    "PLE",     # Pylint Error
    "RUF",     # Ruff specific rules
    "FURB",    # Refurb rules
]
ignore = [
    "E501", # Formatter takes care of that
]
fixable = ["ALL"]
unfixable = []
allowed-confusables = ["–", "❯", "：", "（", "）", "，"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
